proxy_cache_path /var/cache/nginx/naive-cacher levels=1:2 keys_zone=naive_cacher:100m max_size=50g inactive=3650d use_temp_path=off;

upstream naive_cacher {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name go.example.internal goproxy.example.internal registry.example.internal;

    location / {
        proxy_pass http://naive_cacher;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header Accept-Encoding "";

        proxy_cache naive_cacher;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        proxy_cache_methods GET HEAD;
        proxy_cache_valid 200 302 10m;
        proxy_cache_revalidate on;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_ignore_headers Set-Cookie Expires;
        proxy_hide_header Set-Cookie;
        add_header X-Cache-Status $upstream_cache_status always;
    }
}
